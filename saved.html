<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lagos Live | Saved Places, Events & Routes</title>
    <link rel="icon" type="image/png" href="/lagos-live-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/lagos-live-shared.css">

    <style>
        :root {
            --bg: #070d14;
            --sidebar: #0b121b;
            --card: #101923;
            --card-hover: #14222f;
            --border: #1d2b38;
            --text: #ffffff;
            --muted: #718092;
            --blue: #00bfff;
            --blue-dark: #0077ff;
            --green: #20d99b;
            --yellow: #ffc857;
            --red: #ff6078;
            --shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 1000;
        }

        .logo-container {
            margin-bottom: 28px;
            padding: 0 8px;
        }

        .logo {
            height: 38px;
            width: auto;
            border-radius: 8px;
        }

        .nav-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            margin: 18px 12px 8px;
            font-weight: 700;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            margin-bottom: 4px;
        }

        .nav-item:hover {
            color: var(--text);
            background: var(--card-hover);
        }

        .nav-item.active {
            color: var(--red);
            background: rgba(255, 96, 120, 0.12);
            font-weight: 600;
        }

        .nav-icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .sidebar-bottom {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .logout-btn {
            width: 100%;
            background: transparent;
            border: none;
            cursor: pointer;
            text-align: left;
        }

        /* Main */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 28px 36px 60px;
            min-width: 0;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .mobile-menu {
            display: none;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        .welcome h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .welcome p {
            font-size: 13.5px;
            color: var(--muted);
            margin-top: 4px;
        }

        /* Filter Tabs */
        .saved-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .s-tab {
            padding: 8px 16px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .s-tab:hover {
            color: #fff;
            background: var(--card);
        }

        .s-tab.active {
            color: var(--red);
            background: rgba(255, 96, 120, 0.12);
        }

        /* Add Item Bar */
        .add-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 28px;
        }

        .add-form {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
            align-items: end;
            margin-top: 12px;
        }

        @media (max-width: 768px) {
            .add-form {
                grid-template-columns: 1fr;
            }
        }

        .field-input, .field-select {
            width: 100%;
            height: 42px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 12px;
            color: #fff;
            font-size: 13.5px;
            outline: none;
        }

        .field-select option {
            background: #0b151f;
        }

        .btn-add {
            height: 42px;
            padding: 0 20px;
            background: linear-gradient(135deg, var(--blue), var(--blue-dark));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Items Grid */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 18px;
        }

        .saved-item-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .saved-item-card:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 191, 255, 0.4);
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .type-pill {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .type-place { background: rgba(0, 191, 255, 0.15); color: var(--blue); }
        .type-event { background: rgba(255, 200, 87, 0.15); color: var(--yellow); }
        .type-route { background: rgba(32, 217, 155, 0.15); color: var(--green); }
        .type-emergency { background: rgba(255, 96, 120, 0.15); color: var(--red); }

        .item-name {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .item-loc {
            font-size: 12.5px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .item-note {
            font-size: 13px;
            color: #b3c5d6;
            line-height: 1.4;
        }

        .card-actions {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-open {
            padding: 6px 12px;
            background: rgba(0, 191, 255, 0.12);
            color: var(--blue);
            border: 1px solid rgba(0, 191, 255, 0.3);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 14px;
            padding: 6px;
            transition: color 0.2s;
        }

        .btn-delete:hover {
            color: var(--red);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--card);
            border: 1px dashed var(--border);
            border-radius: 20px;
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 48px;
            color: var(--muted);
            margin-bottom: 16px;
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo-container">
                <a href="dashboard.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
                    <img src="/lagos-live-logo.png" alt="Lagos Live" class="logo" onerror="this.src='lagos live logo.png'">
                    <span style="font-weight:800;font-size:15px;color:#fff;">LAGOS LIVE</span>
                </a>
            </div>

            <nav>
                <div class="nav-title">City Pulse</div>
                <a href="dashboard.html" class="nav-item">
                    <span class="nav-icon"><i class="fa-solid fa-gauge-high"></i></span>
                    <span>Dashboard</span>
                </a>
                <a href="transport.html" class="nav-item">
                    <span class="nav-icon"><i class="fa-solid fa-traffic-light"></i></span>
                    <span>Transport & Traffic</span>
                </a>
                <a href="weather.html" class="nav-item">
                    <span class="nav-icon"><i class="fa-solid fa-cloud-sun-rain"></i></span>
                    <span>Weather & Flood</span>
                </a>
                <a href="events.html" class="nav-item">
                    <span class="nav-icon"><i class="fa-solid fa-calendar-check"></i></span>
                    <span>Events & Nightlife</span>
                </a>
                <a href="explore.html" class="nav-item">
                    <span class="nav-icon"><i class="fa-solid fa-compass"></i></span>
                    <span>Explore Lagos</span>
                </a>

                <div class="nav-title">Services & Tools</div>
                <a href="emergency.html" class="nav-item">
                    <span class="nav-icon"><i class="fa-solid fa-truck-medical" style="color:var(--red);"></i></span>
                    <span>Emergency (112)</span>
                </a>
                <a href="saved.html" class="nav-item active">
                    <span class="nav-icon"><i class="fa-solid fa-heart"></i></span>
                    <span>Saved Items</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <span class="nav-icon"><i class="fa-solid fa-gear"></i></span>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-bottom">
                <a href="index.html" class="logout-btn nav-item">
                    <span class="nav-icon"><i class="fa-solid fa-arrow-right-from-bracket"></i></span>
                    <span>Log Out</span>
                </a>
            </div>
        </aside>

        <div class="overlay" id="overlay"></div>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="welcome">
                    <div style="display:flex;align-items:center;gap:12px;">
                        <button class="mobile-menu" id="mobileMenu" aria-label="Toggle navigation">
                            <i class="fa-solid fa-bars"></i>
                        </button>
                        <div>
                            <h1>My Saved Collection</h1>
                            <p>Bookmarked places, planned transit routes, festival passes, and emergency lines.</p>
                        </div>
                    </div>
                </div>

                <div>
                    <button class="district-pill" onclick="seedSampleBookmarks()" style="display:inline-flex;align-items:center;gap:6px;">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <span>Load Lagos Favorites</span>
                    </button>
                </div>
            </header>

            <!-- Filter Tabs -->
            <div class="saved-tabs">
                <button class="s-tab active" onclick="filterSavedTab(this, 'all')">❤️ All Saved Items (<span id="count-all">0</span>)</button>
                <button class="s-tab" onclick="filterSavedTab(this, 'place')">📍 Places (<span id="count-place">0</span>)</button>
                <button class="s-tab" onclick="filterSavedTab(this, 'event')">🎟️ Events (<span id="count-event">0</span>)</button>
                <button class="s-tab" onclick="filterSavedTab(this, 'route')">🧭 Transit Routes (<span id="count-route">0</span>)</button>
                <button class="s-tab" onclick="filterSavedTab(this, 'emergency')">🚨 Emergency (<span id="count-emergency">0</span>)</button>
            </div>

            <!-- Add Custom Item Form -->
            <div class="add-card">
                <strong style="font-size:14px;color:#fff;">+ Add Custom Place or Note</strong>
                <form onsubmit="handleCustomAdd(event)" class="add-form">
                    <div>
                        <input type="text" id="addName" class="field-input" placeholder="Title (e.g. Yellow Chilli Restaurant)" required>
                    </div>
                    <div>
                        <input type="text" id="addLoc" class="field-input" placeholder="Location or Area (e.g. Victoria Island)">
                    </div>
                    <div>
                        <select id="addType" class="field-select">
                            <option value="place">📍 Place / Spot</option>
                            <option value="event">🎟️ Event / Show</option>
                            <option value="route">🧭 Transit Route</option>
                            <option value="emergency">🚨 Emergency Contact</option>
                        </select>
                    </div>
                    <div>
                        <button type="submit" class="btn-add">Save to Collection</button>
                    </div>
                </form>
            </div>

            <!-- Items Grid -->
            <div class="items-grid" id="savedItemsContainer">
                <!-- Dynamically rendered -->
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="/lagos-live-shared.js"></script>
    <script>
        let currentFilter = "all";

        function filterSavedTab(tab, type) {
            document.querySelectorAll(".s-tab").forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            currentFilter = type;
            renderSavedItems();
        }

        function renderSavedItems() {
            const container = document.getElementById("savedItemsContainer");
            const allItems = window.getBookmarks();

            // Update Counts
            document.getElementById("count-all").textContent = allItems.length;
            document.getElementById("count-place").textContent = allItems.filter(x => x.type === "place").length;
            document.getElementById("count-event").textContent = allItems.filter(x => x.type === "event").length;
            document.getElementById("count-route").textContent = allItems.filter(x => x.type === "route").length;
            document.getElementById("count-emergency").textContent = allItems.filter(x => x.type === "emergency").length;

            const filtered = currentFilter === "all" ? allItems : allItems.filter(x => x.type === currentFilter);

            container.innerHTML = "";

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-bookmark"></i>
                        <h3 style="font-size:17px;font-weight:700;margin-bottom:6px;">No saved items in this category</h3>
                        <p style="font-size:13px;color:var(--muted);max-width:420px;margin:0 auto 18px;">
                            Bookmark your favorite beaches, art fairs, train routes or emergency lines from around the app, or add a custom item above.
                        </p>
                        <button class="btn-add" onclick="seedSampleBookmarks()">Load Recommended Lagos Places</button>
                    </div>
                `;
                return;
            }

            filtered.forEach((item, index) => {
                const card = document.createElement("div");
                card.className = "saved-item-card";

                const typeLabels = {
                    place: { label: "Place", class: "type-place", icon: "fa-solid fa-location-dot" },
                    event: { label: "Event", class: "type-event", icon: "fa-regular fa-calendar-check" },
                    route: { label: "Route", class: "type-route", icon: "fa-solid fa-route" },
                    emergency: { label: "Emergency", class: "type-emergency", icon: "fa-solid fa-truck-medical" }
                };

                const typeInfo = typeLabels[item.type] || typeLabels.place;
                const mapLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ', Lagos, Nigeria')}`;

                card.innerHTML = `
                    <div class="card-top">
                        <span class="type-pill ${typeInfo.class}"><i class="${typeInfo.icon}"></i> ${typeInfo.label}</span>
                        <button class="btn-delete" title="Remove item" onclick="deleteSavedItem('${item.id || item.name}')">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                    <h3 class="item-name">${item.title || item.name}</h3>
                    <div class="item-loc"><i class="fa-solid fa-map-pin"></i> ${item.location || 'Lagos, Nigeria'}</div>
                    ${item.note ? `<p class="item-note">${item.note}</p>` : ''}
                    <div class="card-actions">
                        <a href="${mapLink}" target="_blank" rel="noopener noreferrer" class="btn-open">
                            <span>Open in Maps</span> <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>
                        <span style="font-size:11px;color:var(--muted);">Saved locally</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function deleteSavedItem(idOrName) {
            let items = window.getBookmarks();
            items = items.filter(x => x.id !== idOrName && x.name !== idOrName);
            window.saveBookmarks(items);
            renderSavedItems();
            window.showToast("Removed", "Item was removed from your saved list.", "info");
        }

        function handleCustomAdd(e) {
            e.preventDefault();
            const name = document.getElementById("addName").value.trim();
            const loc = document.getElementById("addLoc").value.trim() || "Lagos";
            const type = document.getElementById("addType").value;

            const newItem = {
                id: "custom-" + Date.now(),
                name: name,
                title: name,
                type: type,
                location: loc,
                note: "Added manually to Lagos Live"
            };

            const items = window.getBookmarks();
            items.unshift(newItem);
            window.saveBookmarks(items);
            e.target.reset();
            renderSavedItems();
            window.showToast("Added!", `"${name}" added to your saved collection.`, "success");
        }

        function seedSampleBookmarks() {
            const samples = [
                { id: "place-landmark-beach", name: "Landmark Beach", title: "Landmark Beach", type: "place", location: "Oniru, Victoria Island", note: "Oceanfront leisure, dining, and evening beach concerts." },
                { id: "place-nike-art-gallery", name: "Nike Art Gallery", title: "Nike Art Gallery", type: "place", location: "Lekki Phase 1", note: "5 floors of West African art & textiles." },
                { id: "route-blue-line", name: "Lagos Blue Line Rail", title: "Marina ⇄ Mile 2 Rail", type: "route", location: "Marina Terminal", note: "Fast train bypasses Eko Bridge traffic." },
                { id: "em-lasambus", name: "LASAMBUS Ambulance", title: "LASAMBUS 112 Command", type: "emergency", location: "0812 345 6789 / 112", note: "24/7 mobile intensive care ambulance." }
            ];
            window.saveBookmarks(samples);
            renderSavedItems();
            window.showToast("Loaded Favorites", "Recommended Lagos places & routes added!", "success");
        }

        document.addEventListener("DOMContentLoaded", renderSavedItems);
        window.addEventListener("lagosLiveBookmarksChanged", renderSavedItems);
    </script>
</body>

</html>
